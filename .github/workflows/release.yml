name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify Developer ID signature and notarization
        if: env.MACOS_SIGN_P12 != ''
        run: |
          set -euo pipefail
          for bin in $(find dist -type f -path '*darwin*' -name macjobs); do
            echo "== $bin"
            codesign --verify --strict --verbose=2 "$bin"
            info="$(codesign -dvv "$bin" 2>&1)"
            echo "$info" | grep -E '^(Authority=|TeamIdentifier=|Runtime Version|CodeDirectory)' || true
            # A bare Mach-O cannot be stapled, so "=notarized" cannot be tested offline here.
            # Require the Developer ID chain and the hardened runtime instead.
            echo "$info" | grep -q '^Authority=Developer ID Application:' || { echo "missing Developer ID Authority"; exit 1; }
            echo "$info" | grep -q '^Authority=Developer ID Certification Authority' || { echo "missing Developer ID CA"; exit 1; }
            echo "$info" | grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' || { echo "hardened runtime not enabled"; exit 1; }
          done
